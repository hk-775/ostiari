name: Publish Ostiari release set

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Build the complete Python release set
        run: |
          pip install build
          python tools/check_release_versions.py \
            --release-tag "$GITHUB_REF_NAME"
          mkdir -p release-dist companion-dist
          python -m build --outdir "$GITHUB_WORKSPACE/release-dist" .
          python -m build --outdir "$GITHUB_WORKSPACE/release-dist" gateway
          python -m build --outdir "$GITHUB_WORKSPACE/release-dist" control-plane/backend
          python -m build --outdir "$GITHUB_WORKSPACE/companion-dist" vendor/axonllm

      - name: Verify release wheels outside the checkout
        run: |
          python -m venv /tmp/ostiari-release-verify
          /tmp/ostiari-release-verify/bin/pip install --upgrade pip
          /tmp/ostiari-release-verify/bin/pip install \
            release-dist/*.whl companion-dist/*.whl
          (
            cd /tmp
            PYTHONNOUSERSITE=1 \
            /tmp/ostiari-release-verify/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import os
          import sys

          import axonllm
          import control_plane
          import ostiari
          import ostiari_gateway
          from ostiari_gateway.modules.llm_gateway.axon_router import AxonRouter

          environment = Path(sys.prefix).resolve()
          for module in (axonllm, control_plane, ostiari, ostiari_gateway):
              source = Path(module.__file__).resolve()
              assert environment in source.parents, (module.__name__, source)

          tag = os.environ["GITHUB_REF_NAME"]
          assert tag.startswith("v"), tag
          expected = tag.removeprefix("v")
          first_party = {
              name: version(name)
              for name in (
                  "ostiari",
                  "ostiari-gateway",
                  "ostiari-control-plane",
              )
          }
          assert set(first_party.values()) == {expected}, first_party
          assert ostiari.__version__ == expected
          assert ostiari_gateway.__version__ == expected
          assert control_plane.__version__ == expected
          assert version("axon-llm") == "0.3.1"
          router = AxonRouter()
          router.require()
          assert router.supports_tools()
          assert environment in Path(router.root).resolve().parents
          print("complete release wheel set verified")
          PY
          )

      - name: Generate release SBOM
        run: |
          pip install release-dist/*.whl companion-dist/*.whl
          python tools/python_sbom.py python-sbom.cdx.json

      - name: Publish bundled AxonLLM distribution
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: companion-dist/

      - name: Publish first-party Python distributions
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: release-dist/

      - name: Attach distributions and SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-dist/* companion-dist/* python-sbom.cdx.json --clobber
