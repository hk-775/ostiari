name: Publish Ostiari release set

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the complete Python release set
        run: |
          pip install build
          mkdir -p release-dist
          python -m build --outdir "$GITHUB_WORKSPACE/release-dist" .
          python -m build --outdir "$GITHUB_WORKSPACE/release-dist" vendor/axonllm
          python -m build --outdir "$GITHUB_WORKSPACE/release-dist" gateway
          python -m build --outdir "$GITHUB_WORKSPACE/release-dist" control-plane/backend

      - name: Verify release wheels outside the checkout
        run: |
          python -m venv /tmp/ostiari-release-verify
          /tmp/ostiari-release-verify/bin/pip install --upgrade pip
          /tmp/ostiari-release-verify/bin/pip install release-dist/*.whl
          (
            cd /tmp
            PYTHONNOUSERSITE=1 \
            /tmp/ostiari-release-verify/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import sys

          import axonllm
          import control_plane
          import ostiari
          import ostiari_gateway
          from ostiari_gateway.modules.llm_gateway.axon_router import AxonRouter

          environment = Path(sys.prefix).resolve()
          for module in (axonllm, control_plane, ostiari, ostiari_gateway):
              source = Path(module.__file__).resolve()
              assert environment in source.parents, (module.__name__, source)

          assert version("axon-llm") == "0.3.1"
          router = AxonRouter()
          router.require()
          assert router.supports_tools()
          assert environment in Path(router.root).resolve().parents
          print("complete release wheel set verified")
          PY
          )

      - name: Generate release SBOM
        run: |
          pip install release-dist/*.whl
          python tools/python_sbom.py python-sbom.cdx.json

      - name: Publish all Python distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-dist/

      - name: Attach distributions and SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-dist/* python-sbom.cdx.json --clobber
