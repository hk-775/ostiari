name: CI

on:
  push:
    branches: [main, enterprise]
  pull_request:
    branches: [main, enterprise]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -e gateway/
          pip install pytest ruff

      - name: Lint
        run: ruff check src/ gateway/

      - name: Test
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: control-plane/frontend/package-lock.json

      - name: Install
        working-directory: control-plane/frontend
        run: npm ci

      - name: Type check
        working-directory: control-plane/frontend
        run: npx tsc --noEmit --skipLibCheck

      - name: Build
        working-directory: control-plane/frontend
        run: npx vite build

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -e .
          pip install -e gateway/

      - name: Verify imports
        run: |
          python -c "from ostiari_gateway.server import create_app; print('Gateway OK')"
          python -c "from ostiari_gateway.agent_auth import AgentAuthPolicy; print('Auth OK')"
          python -c "from ostiari_gateway.a2a import A2AManager; print('A2A OK')"
