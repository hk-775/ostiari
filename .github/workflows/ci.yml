name: CI

on:
  push:
    branches: [main]
  # Every PR, not just those targeting main. Stacked PRs (feature → feature →
  # main) previously ran no checks at all: #79 and #80 both merged into an
  # intermediate branch with an empty status rollup, so a broken commit could
  # reach it unnoticed and only surfaced when the parent PR retriggered. The
  # base branch is not a signal about whether code needs testing.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: Core (root package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio anyio hypothesis httpx starlette ruff

      - name: Lint
        run: ruff check src/ gateway/ control-plane/backend/control_plane/ control-plane/backend/tests/

      - name: Type check
        run: mypy src/ostiari

      - name: Test (root suite)
        run: pytest tests/ -v --tb=short

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -e "gateway/[payments,redis]"
          pip install pytest pytest-asyncio anyio pytest-httpserver werkzeug \
                      opentelemetry-api opentelemetry-sdk httpx starlette

      - name: Verify imports
        run: |
          python -c "from ostiari_gateway.server import create_app; print('Gateway OK')"
          python -c "from ostiari_gateway.cross_agent import CrossAgentPolicy; print('CrossAgent OK')"
          python -c "from ostiari_gateway.a2a import A2AManager; print('A2A OK')"
          python -c "from ostiari_gateway.payments import Quote, X402Settler; s=X402Settler(private_key='0x'+'11'*32); s._build_http_client(Quote(action='ci', amount_usdc=.001, atomic_amount=1000, pay_to='0x1')); print('x402 SDK OK')"

      # AxonLLM is deliberately NOT installed here. It owns routing governance and
      # token cost tracking, but it is a separate private repo and not on PyPI, so
      # cloning it would make CI depend on an AXONLLM_TOKEN secret — and the
      # gateway only warns when it's absent, so the suite runs green without it.
      #
      # What this means: the tests below cover Ostiari's own governance (auth,
      # injection, quota, HITL, tool proxy) and the direct-provider fallback path.
      # They do NOT cover live AxonLLM routing — TestLiveRouting and the
      # @requires_axon version guard self-skip here. Run the gateway suite locally
      # against a real AxonLLM checkout before trusting the routing surface.
      - name: Test (gateway suite)
        working-directory: gateway
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  control-plane:
    name: Control Plane (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: control-plane/backend
        run: |
          pip install -e "$GITHUB_WORKSPACE"
          pip install -e ".[dev]"
          # The sidecar package: test_quotas_demo_seed asserts the /push payload
          # matches the gateway's QuotaConfig signature, so it imports it directly.
          pip install -e "$GITHUB_WORKSPACE/gateway"
          pip install aiosqlite greenlet pytest pytest-asyncio anyio httpx
          pip install opentelemetry-exporter-otlp-proto-http

      - name: Test (control-plane suite)
        working-directory: control-plane/backend
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: control-plane/frontend/package-lock.json

      - name: Install
        working-directory: control-plane/frontend
        run: npm ci

      - name: Type check
        working-directory: control-plane/frontend
        run: npx tsc --noEmit --skipLibCheck

      - name: Build
        working-directory: control-plane/frontend
        run: npx vite build

  security:
    name: Security and supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: control-plane/frontend/package-lock.json

      - name: Scan tracked files for credentials
        run: python tools/check_tracked_secrets.py

      - name: Audit Python dependencies and generate SBOM
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/pip install --upgrade pip
          .audit-venv/bin/pip install . "./gateway[payments,redis]" \
            "./control-plane/backend[aws,otlp]" pip-audit
          .audit-venv/bin/python tools/python_sbom.py python-sbom.cdx.json
          .audit-venv/bin/pip uninstall --yes \
            ostiari ostiari-gateway ostiari-control-plane
          .audit-venv/bin/pip-audit --strict

      - name: Audit frontend production dependencies
        working-directory: control-plane/frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm sbom --sbom-format cyclonedx > ../../frontend-sbom.cdx.json

      - name: Validate generated SBOMs
        run: |
          python -m json.tool python-sbom.cdx.json >/dev/null
          python -m json.tool frontend-sbom.cdx.json >/dev/null

  production-artifacts:
    name: Production artifacts
    runs-on: ubuntu-latest
    needs: [core, gateway, control-plane, frontend, security]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Python distributions
        run: |
          pip install build
          python -m build .
          python -m build gateway
          python -m build control-plane/backend

      - name: Exercise full migration chain
        working-directory: control-plane/backend
        run: |
          pip install -e "$GITHUB_WORKSPACE"
          pip install -e ".[dev]"
          PYTHONPATH=. pytest tests/test_migrations.py -q

      - name: Validate deployment templates
        run: |
          pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path("deploy/kubernetes").glob("*.yaml"):
              list(yaml.safe_load_all(path.read_text()))
              print(f"parsed {path}")
          PY
          helm lint deploy/helm/ostiari-gateway \
            --set image.digest="sha256:$(printf 'a%.0s' {1..64})" \
            --set gateway.tenantId="production-org" \
            --set gateway.oidcIssuer="https://issuer.example.com" \
            --set gateway.oidcAudience="ostiari-gateway"
          ! rg 'image:\\s+[^#\\n]*:latest' deploy

      - name: Build production images
        run: |
          docker build -f deploy/docker/Dockerfile.gateway -t ostiari-gateway:ci .
          docker build -f deploy/docker/Dockerfile.control-plane -t ostiari-control-plane:ci .
          docker build -f deploy/docker/Dockerfile.frontend \
            --build-arg VITE_API_URL=https://api.example.com \
            -t ostiari-frontend:ci .
