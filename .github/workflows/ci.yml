name: CI

on:
  push:
    branches: [main]
  # Every PR, not just those targeting main. Stacked PRs (feature → feature →
  # main) previously ran no checks at all: #79 and #80 both merged into an
  # intermediate branch with an empty status rollup, so a broken commit could
  # reach it unnoticed and only surfaced when the parent PR retriggered. The
  # base branch is not a signal about whether code needs testing.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: Core (root package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio anyio hypothesis httpx starlette ruff

      - name: Lint
        run: ruff check src/ gateway/ control-plane/backend/control_plane/ control-plane/backend/tests/

      - name: Type check
        run: mypy src/ostiari

      - name: Test (root suite)
        run: >-
          pytest tests/ -v --tb=short
          --cov=ostiari
          --cov-report=term-missing
          --cov-fail-under=70

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -e "$GITHUB_WORKSPACE/vendor/axonllm[server]"
          pip install -e "gateway/[payments,redis]"
          pip install pytest pytest-asyncio anyio pytest-httpserver werkzeug \
                      opentelemetry-api opentelemetry-sdk httpx starlette

      - name: Verify imports
        run: |
          python -c "from ostiari_gateway.server import create_app; print('Gateway OK')"
          python -c "from ostiari_gateway.cross_agent import CrossAgentPolicy; print('CrossAgent OK')"
          python -c "from ostiari_gateway.a2a import A2AManager; print('A2A OK')"
          python -c "from ostiari_gateway.payments import Quote, X402Settler; s=X402Settler(private_key='0x'+'11'*32); s._build_http_client(Quote(action='ci', amount_usdc=.001, atomic_amount=1000, pay_to='0x1')); print('x402 SDK OK')"

      - name: Verify embedded AxonLLM
        env:
          OSTIARI_AXON_ROOT: ${{ github.workspace }}/vendor/axonllm
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from ostiari_gateway.modules.llm_gateway.axon_router import AxonRouter

          assert version("axon-llm") == "0.3.1"
          router = AxonRouter()
          router.require()
          assert router.supports_tools()
          print(f"AxonLLM {version('axon-llm')} embedded from {router.root}")
          PY

      - name: Test (gateway suite)
        working-directory: gateway
        env:
          OSTIARI_AXON_ROOT: ${{ github.workspace }}/vendor/axonllm
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  codex-conformance:
    name: Codex 0.148.0 conformance
    runs-on: ubuntu-latest
    needs: [gateway]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"

      - name: Install Ostiari and pinned Codex CLI
        run: |
          pip install -e .
          pip install -e "$GITHUB_WORKSPACE/vendor/axonllm[server]"
          pip install -e gateway
          npm install --global @openai/codex@0.148.0
          test "$(codex --version)" = "codex-cli 0.148.0"

      - name: Run Codex Responses conformance
        run: python tools/codex_conformance.py

  control-plane:
    name: Control Plane (backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
        env:
          POSTGRES_DB: ostiari
          POSTGRES_USER: ostiari
          POSTGRES_PASSWORD: ostiari-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ostiari -d ostiari"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: control-plane/backend
        run: |
          pip install -e "$GITHUB_WORKSPACE"
          pip install -e "$GITHUB_WORKSPACE/vendor/axonllm[server]"
          pip install -e ".[dev]"
          # The sidecar package: test_quotas_demo_seed asserts the /push payload
          # matches the gateway's QuotaConfig signature, so it imports it directly.
          pip install -e "$GITHUB_WORKSPACE/gateway"
          pip install aiosqlite greenlet pytest pytest-asyncio anyio httpx
          pip install opentelemetry-exporter-otlp-proto-http

      - name: Test (control-plane suite)
        working-directory: control-plane/backend
        env:
          OSTIARI_TEST_POSTGRES_URL: postgresql+asyncpg://ostiari:ostiari-ci@localhost:5432/ostiari
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: |
            control-plane/frontend/package-lock.json
            dashboard-ui/package-lock.json

      - name: Install
        working-directory: control-plane/frontend
        run: npm ci

      - name: Type check
        working-directory: control-plane/frontend
        run: npx tsc --noEmit --skipLibCheck

      - name: Test frontend behavior
        working-directory: control-plane/frontend
        run: npm test

      - name: Build
        working-directory: control-plane/frontend
        run: npx vite build

      - name: Install embedded dashboard
        working-directory: dashboard-ui
        run: npm ci

      - name: Build embedded dashboard
        working-directory: dashboard-ui
        run: npm run build

  security:
    name: Security and supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: |
            control-plane/frontend/package-lock.json
            dashboard-ui/package-lock.json

      - name: Scan tracked files and reachable history for credentials
        run: python tools/check_tracked_secrets.py --history

      - name: Audit Python dependencies and generate SBOM
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/pip install --upgrade pip
          .audit-venv/bin/pip install . \
            "./vendor/axonllm[server]" \
            "./gateway[payments,redis]" \
            "./control-plane/backend[aws,otlp]" pip-audit
          .audit-venv/bin/python tools/python_sbom.py python-sbom.cdx.json
          .audit-venv/bin/pip uninstall --yes \
            axon-llm ostiari ostiari-gateway ostiari-control-plane
          .audit-venv/bin/pip-audit --strict

      - name: Audit frontend dependencies
        working-directory: control-plane/frontend
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm sbom --sbom-format cyclonedx > ../../frontend-sbom.cdx.json

      - name: Audit embedded dashboard dependencies
        working-directory: dashboard-ui
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm sbom --sbom-format cyclonedx > ../dashboard-sbom.cdx.json

      - name: Validate generated SBOMs
        run: |
          python -m json.tool python-sbom.cdx.json >/dev/null
          python -m json.tool frontend-sbom.cdx.json >/dev/null
          python -m json.tool dashboard-sbom.cdx.json >/dev/null

  production-artifacts:
    name: Production artifacts
    runs-on: ubuntu-latest
    needs: [core, gateway, codex-conformance, control-plane, frontend, security]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.16.0"

      - name: Build Python distributions
        run: |
          pip install build
          python -m build .
          python -m build vendor/axonllm --outdir dist/axonllm
          python -m build gateway
          python -m build control-plane/backend

      - name: Verify clean multi-wheel installation
        run: |
          python -m venv /tmp/ostiari-wheel-verify
          /tmp/ostiari-wheel-verify/bin/pip install --upgrade pip
          /tmp/ostiari-wheel-verify/bin/pip install \
            dist/*.whl \
            dist/axonllm/*.whl \
            gateway/dist/*.whl \
            control-plane/backend/dist/*.whl
          (
            cd /tmp
            PYTHONNOUSERSITE=1 \
            /tmp/ostiari-wheel-verify/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import sys

          import axonllm
          import control_plane
          import ostiari
          import ostiari_gateway
          from ostiari_gateway.modules.llm_gateway.axon_router import AxonRouter

          environment = Path(sys.prefix).resolve()
          for module in (axonllm, control_plane, ostiari, ostiari_gateway):
              source = Path(module.__file__).resolve()
              assert environment in source.parents, (module.__name__, source)

          assert version("axon-llm") == "0.3.1"
          router = AxonRouter()
          router.require()
          assert router.supports_tools()
          assert environment in Path(router.root).resolve().parents
          print("clean wheel set and embedded AxonLLM verified")
          PY
          )

      - name: Exercise full migration chain
        working-directory: control-plane/backend
        run: |
          pip install -e "$GITHUB_WORKSPACE"
          pip install -e ".[dev]"
          PYTHONPATH=. pytest tests/test_migrations.py -q

      - name: Validate deployment templates
        run: |
          pip install pyyaml
          python tools/check_compose_security.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path("deploy/kubernetes").glob("*.yaml"):
              list(yaml.safe_load_all(path.read_text()))
              print(f"parsed {path}")
          PY
          helm lint deploy/helm/ostiari-gateway \
            --set image.digest="sha256:$(printf 'a%.0s' {1..64})" \
            --set gateway.tenantId="production-org" \
            --set gateway.oidcIssuer="https://issuer.example.com" \
            --set gateway.oidcAudience="ostiari-gateway" \
            --set workloadIdentity.tokenUrl="https://issuer.example.com/oauth2/token" \
            --set workloadIdentity.clientId="gateway-production"
          ! rg 'image:\\s+[^#\\n]*:latest' deploy

      - name: Synthesize every AWS deployment profile
        run: |
          python -m venv /tmp/ostiari-cdk-validation
          /tmp/ostiari-cdk-validation/bin/pip install \
            --require-hashes \
            --only-binary=:all: \
            -r deploy/aws/requirements.txt
          npm ci --prefix deploy/aws
          PATH="/tmp/ostiari-cdk-validation/bin:$PATH" \
            /tmp/ostiari-cdk-validation/bin/python deploy/aws/validate.py

      - name: Build production images
        run: |
          docker build -f deploy/docker/Dockerfile.gateway -t ostiari-gateway:ci .
          docker build -f deploy/docker/Dockerfile.control-plane -t ostiari-control-plane:ci .
          docker build -f deploy/docker/Dockerfile.frontend \
            --build-arg VITE_API_URL=https://api.example.com \
            -t ostiari-frontend:ci .
          docker build -f deploy/docker/Dockerfile.demo -t ostiari-demo-tools:ci .
          docker build -f deploy/agentcore/Dockerfile -t ostiari-agentcore:ci .

      - name: Verify every production image defaults to a non-root user
        run: |
          python - <<'PY'
          import json
          import subprocess

          images = (
              "ostiari-gateway:ci",
              "ostiari-control-plane:ci",
              "ostiari-frontend:ci",
              "ostiari-demo-tools:ci",
              "ostiari-agentcore:ci",
          )
          for image in images:
              raw = subprocess.check_output(
                  ["docker", "image", "inspect", image],
                  text=True,
              )
              configured = json.loads(raw)[0]["Config"].get("User", "").strip()
              user = configured.split(":", 1)[0].lower()
              assert user not in {"", "0", "root"}, (image, configured)
              print(f"{image}: USER {configured}")
          PY

      - name: Verify AxonLLM inside the production gateway image
        run: |
          docker run --rm --network none \
            --entrypoint python \
            ostiari-gateway:ci \
            -c "from importlib.metadata import version; from ostiari_gateway.modules.llm_gateway.axon_router import AxonRouter; assert version('axon-llm') == '0.3.1'; r=AxonRouter(); r.require(); assert r.supports_tools(); print('embedded AxonLLM OK')"

      - name: Verify hardened gateway policy writes
        run: |
          docker run --rm --network none \
            --read-only \
            --user 10001:10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint python \
            ostiari-gateway:ci \
            -c "import asyncio, tempfile; from ostiari_gateway.config_manager import ConfigManager; from ostiari_gateway.models import PolicyConfig; assert tempfile.gettempdir() == '/dev/shm'; manager = ConfigManager(); manager.apply_policy(PolicyConfig(allow=['health.check'])); assert manager._policy_file and manager._policy_file.parent.as_posix() == '/dev/shm'; asyncio.run(manager.shutdown()); print('read-only policy write OK')"

      - name: Verify hardened frontend image starts
        run: |
          container_id="$(
            docker run -d --network none \
            --read-only \
            --user 101:101 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            ostiari-frontend:ci
          )"
          cleanup() {
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          attempt=0
          while [ "$attempt" -lt 20 ]; do
            if docker exec "$container_id" /frontend-server --healthcheck; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$container_id")" != "true" ]; then
              docker logs "$container_id"
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 1
          done
          docker logs "$container_id"
          exit 1
