# Full local Ostiari stack: control-plane backend + frontend, one gateway, Redis.
# Build contexts are the REPO ROOT (../..) because the gateway image installs the
# local `ostiari` core package, which lives at the repo root.
#
#   cd deploy/docker && docker compose up --build
services:
  gateway:
    image: ostiari-gateway:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
    ports:
      - "${OSTIARI_GATEWAY_PORT:-8421}:8421"
    environment:
      OSTIARI_GATEWAY_ID: "${OSTIARI_GATEWAY_ID:-crm-agent}"
      OSTIARI_CONTROL_PLANE_URL: "http://control-plane-backend:8400"
      OSTIARI_PORT: "8421"
      # The control plane pushes config back to this URL; must be reachable on
      # the compose network (the service name), not localhost.
      OSTIARI_ADVERTISE_HOST: "gateway"
      # Human-in-the-loop for the intervene tier. On means a call scoring in the
      # middle band stops, returns 202, and waits for someone to approve it in
      # the control plane's Approvals page — so somebody has to be watching that
      # queue or those calls never complete.
      #
      # Left OFF here because this compose file is the local stack. Its effect
      # depends on OSTIARI_ENV: with ENV unset (the default below) an unresolved
      # intervene is allowed through; set ENV=production and the same call is
      # refused instead. So in production these two travel together — turning on
      # production posture without HITL deletes the middle tier.
      OSTIARI_HITL: "${OSTIARI_HITL:-off}"
      # Unset = dev posture: controls fail OPEN, which is what makes the local
      # demo flow. Setting this to "production" flips every control fail-closed
      # and requires rotating workload OIDC credentials plus the other
      # production settings documented in deploy/README.md. Do not set it here
      # without reading §7.4 and §9 of docs/control-plane-guide.md.
      OSTIARI_ENV: "${OSTIARI_ENV:-}"
      # Legacy shared keys are retained only for this local-development stack.
      # Production startup rejects both values.
      OSTIARI_SERVICE_TOKEN: "${OSTIARI_SERVICE_TOKEN:-}"
      OSTIARI_INGEST_KEY: "${OSTIARI_INGEST_KEY:-}"
      OSTIARI_CONFIG_ADMIN_KEY: "${OSTIARI_CONFIG_ADMIN_KEY:-}"
      OSTIARI_REDIS_URL: "redis://redis:6379/0"
      OSTIARI_REQUIRE_AXON: "${OSTIARI_REQUIRE_AXON:-}"
      OSTIARI_X402_MODE: "${OSTIARI_X402_MODE:-simulated}"
      OSTIARI_X402_PRIVATE_KEY: "${OSTIARI_X402_PRIVATE_KEY:-}"
      OSTIARI_X402_ALLOWED_ASSETS: "${OSTIARI_X402_ALLOWED_ASSETS:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      control-plane-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The image runs as uid 10001; these harden it further. Its policy tempfile
    # uses the runtime-provided /dev/shm tmpfs, so no writable root mount is needed.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8421/health', timeout=4).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  control-plane-backend:
    image: ostiari-control-plane:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-plane
    ports:
      - "${OSTIARI_CONTROL_PLANE_PORT:-8400}:8400"
    environment:
      # SQLite on a persisted volume by default. For production point this at
      # Postgres: postgresql+asyncpg://user:pass@host:5432/ostiari
      DATABASE_URL: "sqlite+aiosqlite:////data/control_plane.db"
      # Development SQLite and any one-time legacy state import live here.
      # Runtime configuration itself is written through to SQL.
      OSTIARI_DATA_DIR: "/data"
      OSTIARI_ENV: "${OSTIARI_ENV:-}"
      OSTIARI_NO_DEMO: "${OSTIARI_NO_DEMO:-0}"
      # Local-development compatibility only; production uses workload OIDC.
      OSTIARI_SERVICE_TOKEN: "${OSTIARI_SERVICE_TOKEN:-}"
      OSTIARI_INGEST_KEY: "${OSTIARI_INGEST_KEY:-}"
      OSTIARI_CONFIG_ADMIN_KEY: "${OSTIARI_CONFIG_ADMIN_KEY:-}"
      OSTIARI_BROKER_BILLING: "${OSTIARI_BROKER_BILLING:-simulated}"
      STRIPE_API_KEY: "${STRIPE_API_KEY:-}"
      STRIPE_METER_EVENT_NAME: "${STRIPE_METER_EVENT_NAME:-ostiari_broker_usage}"
      STRIPE_CUSTOMER_ID: "${STRIPE_CUSTOMER_ID:-}"
      STRIPE_CUSTOMER_MAP: "${STRIPE_CUSTOMER_MAP:-}"
    volumes:
      - control-plane-data:/data
    # Runs as uid 10001 with an immutable root filesystem. The volume above is the
    # only writable path it needs — /tmp is not mounted, because nothing in this
    # container writes there. Adding read_only without OSTIARI_DATA_DIR pointing
    # off the root would fail at import, before the app starts.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8400/api/health', timeout=4).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  control-plane-frontend:
    image: ostiari-frontend:dev
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        # Baked into the bundle; called from the browser, so it points at the
        # backend's published host port (localhost:8400), not the service name.
        VITE_API_URL: "${OSTIARI_BROWSER_API_URL:-http://localhost:8400}"
        VITE_DEMO_LOGIN: "${OSTIARI_DEMO_LOGIN:-true}"
    ports:
      - "${OSTIARI_FRONTEND_PORT:-9000}:9000"
    depends_on:
      control-plane-backend:
        condition: service_healthy
    # Runs as nginx's own uid 101. The image keeps all writable nginx state in
    # /dev/shm, which remains writable while the image root stays read-only.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    # Valkey preserves the open-source BSD-3-Clause Redis protocol/API surface.
    image: valkey/valkey:9.0.5-alpine@sha256:0cb61366757e2bcd26500b4e8bb63cbd7117610e3e4f05aacb3c812511da7632
    ports:
      - "${OSTIARI_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  control-plane-data:
