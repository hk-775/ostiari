version: "3.9"

services:
  gateway:
    image: ostiari-gateway:latest
    build:
      context: ../../gateway
      dockerfile: Dockerfile
    ports:
      - "8421:8421"
    environment:
      OSTIARI_GATEWAY_ID: "gateway-1"
      OSTIARI_CONTROL_PLANE_URL: "http://control-plane-backend:8400"
      OSTIARI_PORT: "8421"
      REDIS_ENDPOINT: "redis"
      REDIS_PORT: "6379"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      control-plane-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8421/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  control-plane-backend:
    image: ostiari-control-plane:latest
    build:
      context: ../../control-plane
    ports:
      - "8400:8400"
    environment:
      OSTIARI_DB_PATH: "/data/ostiari.db"
    volumes:
      - control-plane-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8400/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  control-plane-frontend:
    image: ostiari-control-plane:latest
    build:
      context: ../../dashboard-ui
    ports:
      - "9000:9000"
    environment:
      OSTIARI_API_URL: "http://control-plane-backend:8400"
    depends_on:
      control-plane-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  control-plane-data:
