# Full local Ostiari stack: control-plane backend + frontend, one gateway, Redis.
# Build contexts are the REPO ROOT (../..) because the gateway image installs the
# local `ostiari` core package, which lives at the repo root.
#
#   cd deploy/docker && docker compose up --build
services:
  gateway:
    image: ostiari-gateway:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
    ports:
      - "8421:8421"
    environment:
      OSTIARI_GATEWAY_ID: "gateway-1"
      OSTIARI_CONTROL_PLANE_URL: "http://control-plane-backend:8400"
      OSTIARI_PORT: "8421"
      # The control plane pushes config back to this URL; must be reachable on
      # the compose network (the service name), not localhost.
      OSTIARI_ADVERTISE_HOST: "gateway"
      # Human-in-the-loop for the intervene tier. On means a call scoring in the
      # middle band stops, returns 202, and waits for someone to approve it in
      # the control plane's Approvals page — so somebody has to be watching that
      # queue or those calls never complete.
      #
      # Left OFF here because this compose file is the local stack. Its effect
      # depends on OSTIARI_ENV: with ENV unset (the default below) an unresolved
      # intervene is allowed through; set ENV=production and the same call is
      # refused instead. So in production these two travel together — turning on
      # production posture without HITL deletes the middle tier.
      OSTIARI_HITL: "${OSTIARI_HITL:-off}"
      # Unset = dev posture: controls fail OPEN, which is what makes the local
      # demo flow. Setting this to "production" flips every control fail-closed
      # and additionally requires OSTIARI_ADMIN_PASSWORD and OSTIARI_INGEST_KEY
      # on the control plane. Do not set it here without reading §7.4 and §9 of
      # docs/control-plane-guide.md.
      OSTIARI_ENV: "${OSTIARI_ENV:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    depends_on:
      control-plane-backend:
        condition: service_healthy
    # The image runs as uid 10001; these harden it further. read_only makes the
    # root filesystem immutable, so the one path the gateway writes — the rendered
    # policy tempfile — needs the tmpfs below. Without it the container starts
    # healthy and then 500s on the first config push.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8421/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  control-plane-backend:
    image: ostiari-control-plane:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control-plane
    ports:
      - "8400:8400"
    environment:
      # SQLite on a persisted volume by default. For production point this at
      # Postgres: postgresql+asyncpg://user:pass@host:5432/ostiari
      DATABASE_URL: "sqlite+aiosqlite:////data/control_plane.db"
      # Everything writable (SQLite db + state.json) lives here, on the volume.
      # DATABASE_URL above only covers the db; without this, state.json stays in
      # the root-owned app dir and shutdown loses every persisted store.
      OSTIARI_DATA_DIR: "/data"
    volumes:
      - control-plane-data:/data
    # Runs as uid 10001 with an immutable root filesystem. The volume above is the
    # only writable path it needs — /tmp is not mounted, because nothing in this
    # container writes there. Adding read_only without OSTIARI_DATA_DIR pointing
    # off the root would fail at import, before the app starts.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8400/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  control-plane-frontend:
    image: ostiari-frontend:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        # Baked into the bundle; called from the browser, so it points at the
        # backend's published host port (localhost:8400), not the service name.
        VITE_API_URL: "http://localhost:8400"
    ports:
      - "9000:9000"
    depends_on:
      control-plane-backend:
        condition: service_healthy
    # Runs as nginx's own uid 101. The image points the pid file and all five
    # nginx temp dirs at /tmp, so this one tmpfs covers a read-only root.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  control-plane-data:
