{{- include "ostiari-gateway.validateProduction" . }}
{{- $image := printf "%s:%s" .Values.image.repository .Values.image.tag -}}
{{- if .Values.image.digest -}}
{{- $image = printf "%s@%s" .Values.image.repository .Values.image.digest -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ostiari-gateway.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "ostiari-gateway.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ostiari-gateway.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ostiari-gateway.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ostiari-gateway.fullname" . }}-config
          env:
            # URL the control plane pushes config back to. Defaults to the
            # gateway Service DNS so it is reachable in-cluster.
            - name: OSTIARI_ADVERTISE_HOST
              value: {{ .Values.gateway.advertiseHost | default (include "ostiari-gateway.fullname" .) | quote }}
            {{- if .Values.redis.enabled }}
            - name: OSTIARI_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.redis.urlSecretKey }}
            {{- end }}
            {{- if .Values.secrets.existingSecret }}
            - name: OSTIARI_CONFIG_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: config-admin-key
            - name: OSTIARI_WORKLOAD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.workloadIdentity.clientSecretKey }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: anthropic-api-key
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: openai-api-key
                  optional: true
            - name: OSTIARI_X402_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: x402-private-key # gitleaks:allow - Kubernetes Secret key name
                  optional: {{ ne .Values.payments.x402Mode "live" }}
            - name: OSTIARI_X402_ALLOWED_ASSETS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: x402-allowed-assets
                  optional: {{ ne .Values.payments.x402Mode "live" }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
