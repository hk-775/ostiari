replicaCount: 3

image:
  repository: ghcr.io/REPLACE_ORG/ostiari-gateway
  tag: "0.1.0"
  # Required when gateway.env=production. Use a manifest-list digest so the
  # exact release artifact is immutable across architectures.
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8421

gateway:
  id: "gateway-1"
  port: 8421
  controlPlaneUrl: "http://ostiari-control-plane:8400"
  # Host the control plane uses to push config back to this gateway. Defaults
  # to the chart's Service DNS name (reachable in-cluster); override for
  # cross-namespace or external control planes.
  advertiseHost: ""

  # Production is fail-closed and the chart validates every required value.
  env: "production"
  tenantId: ""
  oidcIssuer: ""
  oidcAudience: ""
  rateLimitRpm: 600
  failClosedOnControlPlaneLoss: true

  # Human-in-the-loop for the *intervene* tier (the middle of allow/intervene/
  # block). On, a call scoring in that band does not execute: the gateway answers
  # HTTP 202 with an approval id, a human decides in the control plane's Approvals
  # page, and the caller re-submits with the X-Approval-Id header.
  #
  # Defaulted ON here because this chart's env is "production", and in production
  # the two settings are not independent: fail-closed means an intervene nobody
  # can resolve is REFUSED, not allowed. Off + production silently collapses the
  # three-tier model to two, which is the opposite of why you deployed a
  # governance layer.
  #
  # The cost of on: somebody must actually staff that queue. An unattended queue
  # stalls those calls, and a queue too big to read gets rubber-stamped — worse
  # than not having one. Tune thresholds so the intervene band is rare and
  # meaningful *before* you rely on this. See docs/control-plane-guide.md §7.4.
  hitl: true

# Run unprivileged. The image already sets USER 10001, but a Dockerfile USER is
# only a default that a manifest can override — runAsNonRoot is what makes the
# kubelet *refuse* to start a container running as uid 0, so an image rebuilt
# without USER fails loudly instead of quietly regaining root.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# The gateway writes nothing to its image at runtime — the only write is the
# rendered policy file, which goes to the /tmp emptyDir the deployment mounts.
# So the root filesystem can be immutable, which is what stops a compromised
# gateway from rewriting its own code or installing anything.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

redis:
  enabled: true
  # Secret key containing a redis:// or rediss:// URL with credentials.
  urlSecretKey: "redis-url"

payments:
  # Production charts do not permit simulated settlement.
  x402Mode: "live"

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

secrets:
  # Required secret keys:
  # config-admin-key, service-token, ingest-key, redis-url,
  # x402-private-key, x402-allowed-assets.
  existingSecret: "ostiari-secrets"
