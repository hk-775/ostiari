# Production sidecar template. The agent must send a bearer token accepted by
# the configured OIDC issuer on every governed tool/LLM call.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ostiari-sidecar-config
data:
  OSTIARI_GATEWAY_ID: "gateway-sidecar-1"
  OSTIARI_CONTROL_PLANE_URL: "http://ostiari-control-plane:8400"
  OSTIARI_PORT: "8421"
  OSTIARI_ADVERTISE_HOST: "agent-with-ostiari"
  OSTIARI_ENV: "production"
  OSTIARI_TENANCY_MODE: "single"
  OSTIARI_ORG_ID: "REPLACE_ORG_ID"
  OSTIARI_GATEWAY_AUTH: "required"
  OSTIARI_OIDC_ISSUER: "https://REPLACE_OIDC_ISSUER"
  OSTIARI_OIDC_AUDIENCE: "REPLACE_GATEWAY_AUDIENCE"
  OSTIARI_WORKLOAD_TOKEN_URL: "https://REPLACE_WORKLOAD_ISSUER/oauth2/token"
  OSTIARI_WORKLOAD_CLIENT_ID: "REPLACE_GATEWAY_WORKLOAD_CLIENT_ID"
  OSTIARI_WORKLOAD_TOKEN_AUDIENCE: "ostiari-control-plane"
  OSTIARI_REQUIRE_REDIS: "true"
  OSTIARI_REQUIRE_AXON: "true"
  OSTIARI_GATEWAY_RATE_LIMIT_RPM: "600"
  OSTIARI_FAIL_CLOSED_ON_CP_LOSS: "true"
  OSTIARI_HITL: "on"
  OSTIARI_X402_MODE: "live"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-with-ostiari
automountServiceAccountToken: false
---
apiVersion: v1
kind: Pod
metadata:
  name: agent-with-ostiari
  labels:
    app: agent-with-ostiari
spec:
  serviceAccountName: agent-with-ostiari
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: agent
      image: "ghcr.io/REPLACE_ORG/your-agent@sha256:REPLACE_WITH_64_HEX_DIGEST"
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      ports:
        - containerPort: 8080
          name: agent
      env:
        - name: OSTIARI_GATEWAY_URL
          value: "http://localhost:8421"

    - name: ostiari-gateway
      image: "ghcr.io/REPLACE_ORG/ostiari-gateway@sha256:REPLACE_WITH_64_HEX_DIGEST"
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      ports:
        - containerPort: 8421
          name: gateway
      envFrom:
        - configMapRef:
            name: ostiari-sidecar-config
      env:
        - name: OSTIARI_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: ostiari-secrets
              key: redis-url
        - name: OSTIARI_CONFIG_ADMIN_KEY
          valueFrom:
            secretKeyRef:
              name: ostiari-secrets
              key: config-admin-key
        - name: OSTIARI_WORKLOAD_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: ostiari-secrets
              key: workload-client-secret
        - name: OSTIARI_X402_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: ostiari-secrets
              key: x402-private-key # gitleaks:allow - Kubernetes Secret key name
        - name: OSTIARI_X402_ALLOWED_ASSETS
          valueFrom:
            secretKeyRef:
              name: ostiari-secrets
              key: x402-allowed-assets
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ostiari-secrets
              key: anthropic-api-key
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ostiari-secrets
              key: openai-api-key
              optional: true
      readinessProbe:
        httpGet:
          path: /ready
          port: gateway
        initialDelaySeconds: 3
        periodSeconds: 5
        timeoutSeconds: 3
      livenessProbe:
        httpGet:
          path: /health
          port: gateway
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 3
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 512Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-with-ostiari
spec:
  selector:
    app: agent-with-ostiari
  ports:
    - name: agent
      port: 8080
      targetPort: agent
    - name: gateway
      port: 8421
      targetPort: gateway
