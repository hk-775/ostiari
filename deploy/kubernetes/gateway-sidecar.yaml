apiVersion: v1
kind: ConfigMap
metadata:
  name: ostiari-gateway-config
  namespace: default
data:
  OSTIARI_GATEWAY_ID: "gateway-sidecar-1"
  OSTIARI_CONTROL_PLANE_URL: "http://ostiari-control-plane:8400"
  OSTIARI_PORT: "8421"
  # Control plane pushes config here. The agent-with-ostiari Service (below)
  # exposes port 8421, so advertise that Service DNS name.
  OSTIARI_ADVERTISE_HOST: "agent-with-ostiari"
  # Fail-closed posture. Also requires OSTIARI_ADMIN_PASSWORD and
  # OSTIARI_INGEST_KEY on the control plane.
  OSTIARI_ENV: "production"
  # Human-in-the-loop for the *intervene* tier: 202 instead of executing, a human
  # decides in the Approvals page, caller re-submits with X-Approval-Id. On
  # because production is fail-closed, where an unresolvable intervene is REFUSED
  # rather than allowed — off would collapse three tiers to two.
  #
  # Sidecar-specific caveat: the agent container talks to the gateway over
  # localhost, so it gets the 202 directly. Make sure the agent treats a 202 as
  # "pending, retry with X-Approval-Id" and not as a failed call — an in-process
  # agent loop that only checks for 200 will look like it silently lost the call.
  OSTIARI_HITL: "on"
---
apiVersion: v1
kind: Pod
metadata:
  name: agent-with-ostiari
  labels:
    app: agent-with-ostiari
spec:
  # Applies to both containers in the pod. Your agent image must also be able to
  # run as uid 10001 — if it can't, move this block down to the gateway container
  # only rather than deleting it, so the sidecar stays unprivileged either way.
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: agent
      image: your-agent-image:latest
      ports:
        - containerPort: 8080
          name: agent
      env:
        - name: OSTIARI_GATEWAY_URL
          value: "http://localhost:8421"

    - name: ostiari-gateway
      image: ostiari-gateway:latest
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      ports:
        - containerPort: 8421
          name: gateway
      envFrom:
        - configMapRef:
            name: ostiari-gateway-config
      env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ostiari-secrets
              key: anthropic-api-key
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ostiari-secrets
              key: openai-api-key
              optional: true
      readinessProbe:
        httpGet:
          path: /health
          port: 8421
        initialDelaySeconds: 3
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /health
          port: 8421
        initialDelaySeconds: 5
        periodSeconds: 10
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      # readOnlyRootFilesystem makes / immutable, so the gateway's one write path
      # needs a volume: config pushes render the policy to a tempfile under /tmp.
      # Without this the container boots healthy and then 500s on the first
      # policy push — verified, not theoretical.
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-with-ostiari
spec:
  selector:
    app: agent-with-ostiari
  ports:
    - name: agent
      port: 8080
      targetPort: 8080
    - name: gateway
      port: 8421
      targetPort: 8421
