apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ostiari-control-plane-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # NOTE: For production, replace SQLite with Amazon RDS (PostgreSQL).
  # This PVC is suitable for dev/staging only.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ostiari-control-plane
  labels:
    app: ostiari-control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ostiari-control-plane
  template:
    metadata:
      labels:
        app: ostiari-control-plane
    spec:
      containers:
        - name: backend
          image: ostiari-control-plane:latest
          ports:
            - containerPort: 8400
              name: api
          env:
            - name: OSTIARI_DB_PATH
              value: "/data/ostiari.db"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8400
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8400
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

        - name: frontend
          image: ostiari-control-plane:latest
          command: ["serve-frontend"]
          ports:
            - containerPort: 9000
              name: ui
          env:
            - name: OSTIARI_API_URL
              value: "http://localhost:8400"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ostiari-control-plane-data
---
apiVersion: v1
kind: Service
metadata:
  name: ostiari-control-plane
spec:
  selector:
    app: ostiari-control-plane
  ports:
    - name: api
      port: 8400
      targetPort: 8400
    - name: ui
      port: 9000
      targetPort: 9000
  type: ClusterIP
