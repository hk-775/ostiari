# Production template. Replace every REPLACE_* value and create the
# `ostiari-secrets` Secret before applying. Images are digest-only deliberately:
# a mutable tag is not a production release artifact.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ostiari-control-plane
  labels:
    app: ostiari-control-plane
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ostiari-control-plane
  template:
    metadata:
      labels:
        app: ostiari-control-plane
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ostiari-control-plane
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: "ghcr.io/REPLACE_ORG/ostiari-control-plane@sha256:REPLACE_WITH_64_HEX_DIGEST"
          imagePullPolicy: IfNotPresent
          command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: database-url
            - name: OSTIARI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: encryption-key
      containers:
        - name: backend
          image: "ghcr.io/REPLACE_ORG/ostiari-control-plane@sha256:REPLACE_WITH_64_HEX_DIGEST"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8400
              name: api
          env:
            - name: OSTIARI_ENV
              value: "production"
            - name: OSTIARI_REQUIRE_AUTH
              value: "true"
            - name: OSTIARI_NO_DEMO
              value: "1"
            - name: OSTIARI_TENANCY_MODE
              value: "multi"
            - name: OSTIARI_ORG_ID
              value: "REPLACE_ORG_ID"
            - name: OSTIARI_CONTROL_PLANE_REPLICAS
              value: "2"
            - name: OSTIARI_GATEWAY_CALLBACK_ALLOW
              value: "REPLACE_GATEWAY_CALLBACK_ALLOW"
            - name: OSTIARI_CORS_ORIGINS
              value: "https://REPLACE_CONSOLE_HOST"
            - name: OSTIARI_FRONTEND_URL
              value: "https://REPLACE_CONSOLE_HOST"
            - name: OIDC_ISSUER
              value: "https://REPLACE_OIDC_ISSUER"
            - name: OIDC_REDIRECT_URI
              value: "https://REPLACE_API_HOST/api/auth/sso/callback"
            - name: OIDC_DEFAULT_ROLE
              value: "viewer"
            - name: OSTIARI_WORKLOAD_OIDC_ISSUER
              value: "https://REPLACE_WORKLOAD_ISSUER"
            - name: OSTIARI_WORKLOAD_OIDC_AUDIENCE
              value: "ostiari-control-plane"
            - name: OSTIARI_GATEWAY_AGENT_ID
              value: "control-plane"
            - name: OSTIARI_BROKER_BILLING
              value: "live"
            - name: STRIPE_METER_EVENT_NAME
              value: "ostiari_broker_usage"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: redis-url
            - name: OSTIARI_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: jwt-secret
            - name: OSTIARI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: admin-password
            - name: OSTIARI_CONFIG_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: config-admin-key
            - name: OSTIARI_GATEWAY_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: gateway-agent-token
            - name: OSTIARI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: encryption-key
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: oidc-client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: oidc-client-secret
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: stripe-api-key
            - name: STRIPE_CUSTOMER_ID
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: stripe-customer-id
          readinessProbe:
            httpGet:
              path: /api/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: api
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

        # VITE_API_URL is compiled into this image. Build it with the public
        # HTTPS API URL before publishing the digest referenced here.
        - name: frontend
          image: "ghcr.io/REPLACE_ORG/ostiari-frontend@sha256:REPLACE_WITH_64_HEX_DIGEST"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 9000
              name: ui
          readinessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ostiari-control-plane
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ostiari-control-plane
---
apiVersion: v1
kind: Service
metadata:
  name: ostiari-control-plane
spec:
  selector:
    app: ostiari-control-plane
  ports:
    - name: api
      port: 8400
      targetPort: api
    - name: ui
      port: 9000
      targetPort: ui
  type: ClusterIP
