apiVersion: v1
kind: ConfigMap
metadata:
  name: ostiari-gateway-config
  namespace: default
data:
  OSTIARI_GATEWAY_ID: "gateway-shared"
  OSTIARI_CONTROL_PLANE_URL: "http://ostiari-control-plane:8400"
  OSTIARI_PORT: "8421"
  # Config push targets the Service DNS (reaches one replica); all replicas also
  # pull config on each heartbeat, so the fleet self-syncs.
  OSTIARI_ADVERTISE_HOST: "ostiari-gateway"
  # Fail-closed posture. Also requires OSTIARI_ADMIN_PASSWORD and
  # OSTIARI_INGEST_KEY on the control plane; the gateway warns at startup about
  # any control still left open (OSTIARI_STRICT=1 makes that fatal).
  OSTIARI_ENV: "production"
  # Human-in-the-loop for the *intervene* tier: a call scoring in the middle band
  # returns HTTP 202 instead of executing, a human decides in the Approvals page,
  # and the caller re-submits with X-Approval-Id.
  #
  # On because OSTIARI_ENV is production, and there the two are not independent:
  # fail-closed means an intervene nobody can resolve is REFUSED. Off + production
  # collapses the three-tier model to two. Requires that someone actually staff
  # the queue — see docs/control-plane-guide.md §7.4.
  OSTIARI_HITL: "on"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ostiari-gateway
  labels:
    app: ostiari-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ostiari-gateway
  template:
    metadata:
      labels:
        app: ostiari-gateway
    spec:
      containers:
        - name: gateway
          image: ostiari-gateway:latest
          ports:
            - containerPort: 8421
          envFrom:
            - configMapRef:
                name: ostiari-gateway-config
          env:
            - name: REDIS_ENDPOINT
              value: "ostiari-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: anthropic-api-key
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: openai-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8421
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8421
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ostiari-gateway
spec:
  selector:
    app: ostiari-gateway
  ports:
    - port: 8421
      targetPort: 8421
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ostiari-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ostiari-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
