# Production shared-gateway template. Replace every REPLACE_* value, create the
# required Secret keys, and point redis-url at a TLS/authenticated managed Redis.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ostiari-gateway-config
data:
  OSTIARI_GATEWAY_ID: "gateway-shared"
  OSTIARI_CONTROL_PLANE_URL: "http://ostiari-control-plane:8400"
  OSTIARI_PORT: "8421"
  OSTIARI_ADVERTISE_HOST: "ostiari-gateway"
  OSTIARI_ENV: "production"
  OSTIARI_TENANCY_MODE: "single"
  OSTIARI_ORG_ID: "REPLACE_ORG_ID"
  OSTIARI_GATEWAY_AUTH: "required"
  OSTIARI_OIDC_ISSUER: "https://REPLACE_OIDC_ISSUER"
  OSTIARI_OIDC_AUDIENCE: "REPLACE_GATEWAY_AUDIENCE"
  OSTIARI_WORKLOAD_TOKEN_URL: "https://REPLACE_WORKLOAD_ISSUER/oauth2/token"
  OSTIARI_WORKLOAD_CLIENT_ID: "REPLACE_GATEWAY_WORKLOAD_CLIENT_ID"
  OSTIARI_WORKLOAD_TOKEN_AUDIENCE: "ostiari-control-plane"
  OSTIARI_REQUIRE_REDIS: "true"
  OSTIARI_REQUIRE_AXON: "true"
  OSTIARI_GATEWAY_RATE_LIMIT_RPM: "600"
  OSTIARI_FAIL_CLOSED_ON_CP_LOSS: "true"
  OSTIARI_HITL: "on"
  OSTIARI_X402_MODE: "live"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ostiari-gateway
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ostiari-gateway
  labels:
    app: ostiari-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ostiari-gateway
  template:
    metadata:
      labels:
        app: ostiari-gateway
    spec:
      serviceAccountName: ostiari-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ostiari-gateway
      containers:
        - name: gateway
          image: "ghcr.io/REPLACE_ORG/ostiari-gateway@sha256:REPLACE_WITH_64_HEX_DIGEST"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8421
              name: http
          envFrom:
            - configMapRef:
                name: ostiari-gateway-config
          env:
            - name: OSTIARI_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: redis-url
            - name: OSTIARI_CONFIG_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: config-admin-key
            - name: OSTIARI_WORKLOAD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: workload-client-secret
            - name: OSTIARI_X402_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: x402-private-key # gitleaks:allow - Kubernetes Secret key name
            - name: OSTIARI_X402_ALLOWED_ASSETS
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: x402-allowed-assets
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: anthropic-api-key
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ostiari-secrets
                  key: openai-api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ostiari-gateway
spec:
  selector:
    app: ostiari-gateway
  ports:
    - name: http
      port: 8421
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ostiari-gateway
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ostiari-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ostiari-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ostiari-gateway
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
