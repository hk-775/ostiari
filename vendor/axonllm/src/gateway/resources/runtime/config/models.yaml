# --- xAI (Grok) ---
# grok-3 and grok-3-mini both still answer 200, so nothing looked broken — but
# xAI resolves both to grok-4.3 and says so in the response's `model` field.
# They are undocumented aliases: absent from /v1/language-models, absent from
# the price list, and therefore unpriceable, which meant every Grok request
# billed $0.00 while being served by a model that costs $1.25/$2.50 per MTok.
# The two real tiers are named directly instead. There is no "mini" in the
# 4.x line; 4.3 is the cheaper of the two.
- name: grok-4.3
  description: Grok 4.3
  capabilities: [chat, streaming, tools]
  routing_strategy: round-robin
  providers:
  - provider: xai
    model_id: grok-4.3
    weight: 1.0
    fallback_order: 0
- name: grok-4.5
  description: Grok 4.5
  capabilities: [chat, streaming, tools]
  routing_strategy: round-robin
  providers:
  - provider: xai
    model_id: grok-4.5
    weight: 1.0
    fallback_order: 0
