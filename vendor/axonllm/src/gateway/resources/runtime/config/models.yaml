# --- Together AI ---
# Together lists ~163 chat models but serves only a handful over the shared
# serverless endpoint; the rest return 400 "Unable to access non-serverless
# model … create and start a new dedicated endpoint". That is a per-account
# provisioning error, not a wrong id, so it cannot be fixed by renaming — the
# model has to be one Together actually hosts serverlessly. Each id below was
# confirmed with a live non-streaming completion.
- name: together-llama-3.3-70b
  description: Llama 3.3 70B Turbo (Together)
  capabilities: [chat, streaming, tools]
  routing_strategy: round-robin
  providers:
  - provider: together
    model_id: meta-llama/Llama-3.3-70B-Instruct-Turbo
    weight: 1.0
    fallback_order: 0
# Was deepseek-ai/DeepSeek-R1, which is not serverless — nor is R1-0528, nor
# V3.1. V4 Pro is the DeepSeek generation Together serves on demand.
- name: together-deepseek-v4
  description: DeepSeek V4 Pro (Together)
  capabilities: [chat, streaming, tools]
  routing_strategy: round-robin
  providers:
  - provider: together
    model_id: deepseek-ai/DeepSeek-V4-Pro
    weight: 1.0
    fallback_order: 0
# Was Qwen/Qwen2.5-72B-Instruct-Turbo, also non-serverless. No 72B-class Qwen
# is: 2-72B, 2.5-72B, Qwen3-Next-80B, Qwen3.5-397B and QwQ-32B all refuse.
# The Qwen3.x -Plus/-Max tier is serverless but streaming-only (400 'This model
# only supports streaming'), which this gateway's non-streaming path cannot use,
# so the largest usable Qwen is 3.5-9B.
- name: together-qwen-3.5-9b
  description: Qwen 3.5 9B (Together)
  capabilities: [chat, streaming]
  routing_strategy: round-robin
  providers:
  - provider: together
    model_id: Qwen/Qwen3.5-9B
    weight: 1.0
    fallback_order: 0
# Same open-weight model as the bedrock and bedrock-mantle gpt-oss-120b entries,
# at the same published rate ($0.15/$0.60 per MTok) — a genuine second source for
# it rather than a duplicate, and the adapter already advertised it.
- name: together-gpt-oss-120b
  description: GPT-OSS 120B (Together)
  capabilities: [chat, streaming]
  routing_strategy: round-robin
  providers:
  - provider: together
    model_id: openai/gpt-oss-120b
    weight: 1.0
    fallback_order: 0
# --- Fireworks AI ---
# Both ids confirmed against GET /inference/v1/models (2026-07-30), which lists
# 19 serverless models — these two among them. They were carried here unverified
# for a while, because the endpoint needs a key and there was none; the note
# then said so rather than implying the ids had been checked.
#
# Both are priced too. An earlier note claimed Fireworks published no per-model
# serverless rates, which was wrong and is what kept them billing at $0.00 —
# each model's page on fireworks.ai/models carries its own rate. See the
# fireworks section in pricing.yaml.
- name: fireworks-deepseek-v4
  description: DeepSeek V4 Pro (Fireworks)
  capabilities: [chat, streaming]
  routing_strategy: round-robin
  providers:
  - provider: fireworks
    model_id: accounts/fireworks/models/deepseek-v4-pro
    weight: 1.0
    fallback_order: 0
- name: fireworks-gpt-oss-120b
