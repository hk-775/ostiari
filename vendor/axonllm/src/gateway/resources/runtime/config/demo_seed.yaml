policies:
  - name: allow-all-read
    description: Allow all users read access
    policy_text: 'permit(principal, action == Action::"read", resource);'
    mode: ENFORCE
  - name: allow-all-write
    description: Allow authenticated users to make requests (write actions)
    policy_text: 'permit(principal, action == Action::"write", resource);'
    mode: ENFORCE
  - name: restrict-gpt4
    description: Restrict GPT-4 to senior devs
    policy_text: 'forbid(principal, action, resource) unless { principal.role == "senior" };'
    mode: LOG_ONLY

# --- Policy hierarchy --------------------------------------------------------
# The org > business_unit > project > environment tree the Govern > Hierarchy
# page renders and the quota enforcer reads on every request. Distinct from the
# `policies` section above, which is Cedar authorization text.
#
# Seeded because the feature's whole point is inheritance, and inheritance is
# invisible with one level: before this, the only nodes that existed were flat
# per-project ones synthesized from each project's budget_limit, every one with
# parent_id: null. Nothing on screen showed a limit being narrowed by a parent.
#
# Two rules govern what the numbers may say, and both are enforced by tests:
#
# 1. A child may never exceed its parent — the resolver rejects it outright
#    (PolicyHierarchyResolver.validate_node_limits), so a seed that violated
#    this would fail at startup rather than load quietly.
# 2. The resolved limits must not throttle the shipped demo. proj-alpha is the
#    project the chat playground posts to (bootstrap picks the first seeded
#    project as its default), so its effective rate and budget stay at least
#    what a demo session needs, and its allowed_models stays a superset of the
#    48 models the project itself lists. The tighter values live on proj-beta
#    and on the environment nodes, which no demo traffic touches.
policy_nodes:
  - node_id: org:acme
    node_type: org
    parent_id: null
    display_name: Acme Corp
    limits:
      rate_limit_rpm: 5000
      budget_limit: 50000.0
      max_tokens_per_request: 32768

  # Redaction is switched on at the BU rather than the org so the page shows
  # both states: a child inheriting PII settings it did not ask for, and a
  # sibling BU with redaction off. Once a parent enables it no descendant can
  # turn it off, which is the invariant worth being able to point at.
  - node_id: bu:platform
    node_type: business_unit
    parent_id: org:acme
    display_name: Platform Engineering
    limits:
      rate_limit_rpm: 2000
      budget_limit: 20000.0
      pii_redaction_enabled: true
      # Widened past the original email+ssn so the demo prompt's phone, card and
      # host address are actually redacted on the request path. They were being
      # caught in the preview panel but passed through on a real call, which
      # made the panel look like it was overstating what the gateway does.
      #
      # Not the full pattern set: aws_account_id matches any bare 12-digit
      # number and passport matches a letter followed by 6-9 digits, both of
      # which fire on ordinary identifiers in demo traffic. Leaving them off is
      # itself the point — the type list is a policy decision, not a default.
      pii_redact_types:
        - email
        - ssn
        - phone
        - credit_card
        - ip_address
        - medical_record

  # Entity detection lives here rather than on bu:platform so the two BUs show
  # the two regimes side by side: platform redacts what regex can match, research
  # also redacts names and addresses. Putting it on platform would have changed
  # what every existing demo request does, and proj-alpha (the playground's
  # default project) hangs off platform.
  #
  # This is the only node in the seed that costs money per request — Comprehend
  # bills ~$0.0001/100 chars, more than the model's own input tokens for the same
  # text. Scoped to one BU on purpose; see the README section on the limits of
  # regex for why it is not a sensible global default.
  - node_id: bu:research
    node_type: business_unit
    parent_id: org:acme
    display_name: Applied Research
    limits:
      rate_limit_rpm: 1000
      budget_limit: 15000.0
      max_tokens_per_request: 16384
      pii_redaction_enabled: true
      # Matches bu:platform's list rather than a shorter one. The first draft
      # here was [email, ssn, phone], which made proj-beta redact the name but
      # leave the credit card and host IP in place — the BU with the extra
      # detector was measurably *less* protective than its sibling on the
      # structured types, which reads as a bug in the product rather than a
      # policy choice. The two BUs should differ in one axis only: entity
      # detection.
      pii_redact_types:
        - email
        - ssn
        - phone
        - credit_card
        - ip_address
        - medical_record
      pii_ner_enabled: true
      # name only, not the full name/address/age default. Research prompts are
      # full of place names and organisations, and address would redact "Seattle"
      # out of a legitimate question. The narrower set is the honest demo of how
      # you would actually deploy this.
      pii_ner_types:
        - name

  # No allowed_models here: proj-alpha carries the demo's 48-model list on the
  # project record itself, and an intersection at this level would silently
  # shrink what the Models page offers. Budget matches the project's own 500.0
  # so the Quotas page agrees with the Projects page.
  - node_id: proj-alpha
    node_type: project
    parent_id: bu:platform
    display_name: Alpha Team
    limits:
      rate_limit_rpm: 1000
      budget_limit: 500.0

  - node_id: proj-beta
    node_type: project
    parent_id: bu:research
    display_name: Beta Team
    limits:
      rate_limit_rpm: 200
      budget_limit: 200.0
      allowed_models:
        - claude-haiku
        - gpt-4o-mini
        - nova-lite
        - nova-micro

  # Environment nodes are addressed as "<project>:<env>" — get_ancestry builds
  # that id when a caller passes ?env=, so the separator is not decorative.
  #
  # prod is the *tighter* of the two on purpose. The intuition runs the other
  # way (production should get more headroom), but these are per-request
  # ceilings on a shared gateway: a runaway prod job is the expensive one, and
  # a dev sandbox is where someone legitimately asks for a long completion.
  - node_id: proj-alpha:prod
    node_type: environment
    parent_id: proj-alpha
    display_name: Alpha Production
    limits:
      rate_limit_rpm: 600
      max_tokens_per_request: 4096
      # Strict regime: redaction is permanent here. Once this is false no
      # descendant can re-enable re-injection, so responses come back with the
      # placeholder tokens still in place rather than the original values.
      pii_reinject: false

  - node_id: proj-alpha:dev
    node_type: environment
    parent_id: proj-alpha
    display_name: Alpha Development
    limits:
      rate_limit_rpm: 300
      max_tokens_per_request: 8192

  - node_id: proj-beta:prod
    node_type: environment
    parent_id: proj-beta
    display_name: Beta Production
    limits:
      rate_limit_rpm: 120
      max_tokens_per_request: 4096

unhealthy_providers:
  - provider: azure_openai
    cooldown_seconds: 600

# --- API Keys page -----------------------------------------------------------
# Issued through APIKeyService at startup, so these are real hashed records.
# The raw key is generated and discarded -- the dashboard only ever shows the
# prefix and metadata, so there is nothing to hardcode here.
api_keys:
  - project_id: proj-alpha
    name: alpha-prod-gateway
    scopes: [chat:invoke, models:read]
    created_by: user-alice
    expires_in_days: 90
  - project_id: proj-alpha
    name: alpha-ci-pipeline
    scopes: [chat:invoke]
    created_by: user-bob
    expires_in_days: 30
  - project_id: proj-alpha
    name: alpha-legacy-key
    scopes: [chat:invoke]
    created_by: user-alice
    revoked: true
  - project_id: proj-beta
    name: beta-eval-harness
    scopes: [chat:invoke, models:read]
    created_by: user-carol
    expires_in_days: 14

# --- Audit Log page ----------------------------------------------------------
# Recorded via AuditTrail.record so each entry gets a real hash-chain link and
# the page's integrity check passes. Order matters: entries chain in sequence.
# Covers the event types the page filters on, including the security-relevant
# ones (injection, PII, policy deny, auth failure) so those views aren't empty.
audit_events:
  - event_type: auth_success
    user_id: user-alice
    project_id: proj-alpha
    request_id: req-demo-0001
    data: {method: api_key, key_name: alpha-prod-gateway}
  - event_type: llm_request
    user_id: user-alice
    project_id: proj-alpha
    request_id: req-demo-0002
    data: {model: claude-sonnet-5, provider: anthropic, message_count: 3}
  - event_type: pii_redaction
    user_id: user-alice
    project_id: proj-alpha
    request_id: req-demo-0002
    data: {redacted_types: [EMAIL, PHONE], count: 2}
  - event_type: llm_response
    user_id: user-alice
    project_id: proj-alpha
    request_id: req-demo-0002
    data: {model: claude-sonnet-5, provider: anthropic, completion_tokens: 210}
  - event_type: injection_detected
    user_id: user-bob
    project_id: proj-alpha
    request_id: req-demo-0003
    data:
      threat_level: medium
      patterns: [ignore_previous_instructions]
      blocked: false
  - event_type: injection_blocked
    user_id: user-bob
    project_id: proj-alpha
    request_id: req-demo-0004
    data:
      threat_level: high
      patterns: [system_prompt_exfiltration, role_override]
      blocked: true
  - event_type: policy_deny
    user_id: user-bob
    project_id: proj-alpha
    request_id: req-demo-0005
    data: {policy: restrict-gpt4, reason: principal.role != senior, model: gpt-4o}
  - event_type: auth_failure
    user_id: unknown
    project_id: proj-beta
    request_id: req-demo-0006
    data: {method: api_key, reason: key_expired}
  - event_type: key_issued
    user_id: user-carol
    project_id: proj-beta
    request_id: req-demo-0007
    data: {key_name: beta-eval-harness, scopes: [chat:invoke, models:read]}
  - event_type: key_rotated
    user_id: user-alice
    project_id: proj-alpha
    request_id: req-demo-0008
    data: {key_name: alpha-ci-pipeline}
  - event_type: key_revoked
    user_id: user-alice
    project_id: proj-alpha
    request_id: req-demo-0009
    data: {key_name: alpha-legacy-key, reason: superseded}
  - event_type: llm_request
    user_id: user-carol
    project_id: proj-beta
    request_id: req-demo-0010
    data: {model: nova-lite, provider: bedrock, message_count: 1}

# --- Webhooks page -----------------------------------------------------------
# Registered destinations only; nothing is dispatched at startup, so the stats
# counters stay at zero until a real event fires. Config values are
# non-routable placeholders by design -- see the note in README.
webhook_destinations:
  - name: security-alerts-slack
    type: webhook
    config:
      url: https://hooks.example.invalid/services/DEMO/SECURITY/ALERTS
      timeout_seconds: 5
    event_filter: [injection_blocked, policy_deny, auth_failure]
    enabled: true
  - name: audit-archive-cloudwatch
    type: cloudwatch
    config:
      log_group: /axonllm/demo/audit
      region: us-east-1
    enabled: true
  - name: budget-alerts-sns
    type: sns
    config:
      topic_arn: arn:aws:sns:us-east-1:000000000000:axonllm-demo-budget-alerts
      region: us-east-1
    event_filter: [budget_exceeded]
    enabled: true
  - name: legacy-pagerduty
    type: webhook
    config:
      url: https://events.example.invalid/v2/enqueue
    enabled: false
