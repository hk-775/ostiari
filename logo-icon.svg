<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Icon-only version (for favicons, app icons) -->
  <!-- Rounded doorway arch -->
  <rect x="12" y="8" width="40" height="52" rx="20" ry="20" stroke="#4338ca" stroke-width="4" fill="none"/>
  <!-- The threshold line -->
  <line x1="32" y1="20" x2="32" y2="48" stroke="#4338ca" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <!-- Guardian point (the ostiari) -->
  <circle cx="38" cy="32" r="5" fill="#d97706"/>
</svg>
