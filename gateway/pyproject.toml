[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ostiari-gateway"
version = "0.1.0"
description = "Agent Gateway — validates, routes, and proxies agent tool calls"
requires-python = ">=3.11"
dependencies = [
    "ostiari>=0.1.0",
    "axon-llm[server]==0.3.1",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "click>=8.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    # OIDC/JWKS validation for gateway auth (RS256 needs the cryptography backend).
    "PyJWT[crypto]>=2.10",
]

# Source and container builds install the exact AxonLLM source bundled under
# vendor/axonllm. Binary distribution publishes the matching axon-llm wheel
# beside this gateway wheel.
[project.optional-dependencies]
routing = [
    "tiktoken>=0.7",
]
# Fleet-wide shared enforcement state (rate limit / budget / wallets) across
# horizontally-scaled replicas. Without it the gateway runs fine with
# per-process limits (the import is lazy, only when a Redis endpoint is set).
redis = [
    "redis[hiredis]>=5.0",
]
# Native x402 v2 payments for passthrough HTTP tools. Kept optional so the
# default simulated demo does not install wallet/signing dependencies.
payments = [
    "x402[httpx,evm]>=2.18,<3",
]

[project.scripts]
ostiari-gateway = "ostiari_gateway.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["ostiari_gateway"]

# AxonLLM's public wheel intentionally contains code, not deployment-specific
# routing catalogs. Ostiari's gateway wheel carries the exact reviewed catalog
# used by the embedded profile so a wheel-only install does not depend on a
# source checkout or an operator-set OSTIARI_AXON_ROOT.
[tool.hatch.build.targets.wheel.force-include]
"../vendor/axonllm/config/models.yaml" = "ostiari_gateway/_embedded/axonllm/config/models.yaml"
"../vendor/axonllm/config/providers.yaml.example" = "ostiari_gateway/_embedded/axonllm/config/providers.yaml.example"
"../vendor/axonllm/config/pricing.yaml" = "ostiari_gateway/_embedded/axonllm/config/pricing.yaml"
"../vendor/axonllm/config/leaderboard.yaml" = "ostiari_gateway/_embedded/axonllm/config/leaderboard.yaml"
"../vendor/axonllm/config/ensemble.yaml" = "ostiari_gateway/_embedded/axonllm/config/ensemble.yaml"
"../vendor/axonllm/LICENSE" = "ostiari_gateway/_embedded/axonllm/LICENSE"
"../vendor/axonllm/THIRD_PARTY_NOTICES.md" = "ostiari_gateway/_embedded/axonllm/THIRD_PARTY_NOTICES.md"
"../vendor/axonllm/UPSTREAM.md" = "ostiari_gateway/_embedded/axonllm/UPSTREAM.md"
