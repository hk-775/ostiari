[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ostiari-gateway"
version = "0.1.0"
description = "Agent Gateway — validates, routes, and proxies agent tool calls"
requires-python = ">=3.10"
dependencies = [
    "ostiari>=0.1.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "click>=8.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    # OIDC/JWKS validation for gateway auth (RS256 needs the cryptography backend).
    "python-jose[cryptography]>=3.3",
]

# AxonLLM provides the embedded routing engine (smart task-classification
# routing, ensemble, multi-provider). It is imported as the ``src.gateway.*``
# package and installed separately (editable, not on PyPI):
#     uv pip install -e ../AxonLLM tiktoken
# When absent, the gateway degrades gracefully: smart routing is disabled and
# routing falls back to explicit rules + default model (logged at startup).
[project.optional-dependencies]
routing = [
    "tiktoken>=0.7",   # required by AxonLLM smart_routing token estimation
]
# Fleet-wide shared enforcement state (rate limit / budget / wallets) across
# horizontally-scaled replicas. Without it the gateway runs fine with
# per-process limits (the import is lazy, only when a Redis endpoint is set).
redis = [
    "redis[hiredis]>=5.0",
]
# Native x402 v2 payments for passthrough HTTP tools. Kept optional so the
# default simulated demo does not install wallet/signing dependencies.
payments = [
    "x402[httpx,evm]>=2.18,<3",
]

[project.scripts]
ostiari-gateway = "ostiari_gateway.main:cli"
