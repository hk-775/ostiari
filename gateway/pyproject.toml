[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ostiari-gateway"
version = "0.1.0"
description = "Agent Gateway — validates, routes, and proxies agent tool calls"
requires-python = ">=3.10"
dependencies = [
    "ostiari>=0.1.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "httpx>=0.25",
    "pyyaml>=6.0",
    "click>=8.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.scripts]
ostiari-gateway = "ostiari_gateway.main:cli"
