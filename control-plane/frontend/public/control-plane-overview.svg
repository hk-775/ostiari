<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="900" height="500" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#1e1b4b" letter-spacing="0.5">HOW THE CONTROL PLANE WORKS</text>

  <!-- ===== LEFT: Operators/Users ===== -->
  <g transform="translate(40, 70)">
    <rect width="140" height="160" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="drop-shadow(0 1px 3px rgba(0,0,0,0.06))"/>
    <text x="70" y="24" text-anchor="middle" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1">OPERATORS</text>
    <!-- Person icons -->
    <circle cx="45" cy="60" r="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="45" y="64" text-anchor="middle" font-size="10" fill="#6d28d9">👤</text>
    <text x="45" y="82" text-anchor="middle" font-size="8" fill="#6b7280">Admin</text>

    <circle cx="95" cy="60" r="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="95" y="64" text-anchor="middle" font-size="10" fill="#0284c7">👤</text>
    <text x="95" y="82" text-anchor="middle" font-size="8" fill="#6b7280">Operator</text>

    <circle cx="70" cy="115" r="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="119" text-anchor="middle" font-size="10" fill="#059669">👤</text>
    <text x="70" y="137" text-anchor="middle" font-size="8" fill="#6b7280">Viewer</text>
  </g>

  <!-- Arrow: Operators → Control Plane -->
  <path d="M185 150 L250 150" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <text x="217" y="142" text-anchor="middle" font-size="7" fill="#8b5cf6">SSO / JWT</text>

  <!-- ===== CENTER: Control Plane ===== -->
  <g transform="translate(255, 55)">
    <rect width="380" height="320" rx="14" fill="white" stroke="#7c3aed" stroke-width="2.5" filter="drop-shadow(0 4px 12px rgba(124,58,237,0.12))"/>
    <rect width="380" height="32" rx="14" ry="0" fill="#7c3aed"/>
    <rect x="0" y="14" width="380" height="18" fill="#7c3aed"/>
    <text x="190" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="white" letter-spacing="0.5">OSTIARI CONTROL PLANE</text>

    <!-- Grid of capabilities -->
    <!-- Row 1 -->
    <rect x="15" y="45" width="108" height="50" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="69" y="65" text-anchor="middle" font-size="8" font-weight="600" fill="#5b21b6">📊 Dashboard</text>
    <text x="69" y="78" text-anchor="middle" font-size="7" fill="#7c7c8a">Metrics · Health</text>

    <rect x="135" y="45" width="108" height="50" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="189" y="65" text-anchor="middle" font-size="8" font-weight="600" fill="#991b1b">🛡 Policies</text>
    <text x="189" y="78" text-anchor="middle" font-size="7" fill="#7c7c8a">Allow · Block · Score</text>

    <rect x="255" y="45" width="108" height="50" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="309" y="65" text-anchor="middle" font-size="8" font-weight="600" fill="#1e40af">🧠 Models</text>
    <text x="309" y="78" text-anchor="middle" font-size="7" fill="#7c7c8a">Access · Budget · Route</text>

    <!-- Row 2 -->
    <rect x="15" y="105" width="108" height="50" rx="8" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="69" y="125" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">📡 Traces</text>
    <text x="69" y="138" text-anchor="middle" font-size="7" fill="#7c7c8a">Real-time · OTLP</text>

    <rect x="135" y="105" width="108" height="50" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="189" y="125" text-anchor="middle" font-size="8" font-weight="600" fill="#9a3412">💰 Costs</text>
    <text x="189" y="138" text-anchor="middle" font-size="7" fill="#7c7c8a">Per-agent · Alerts</text>

    <rect x="255" y="105" width="108" height="50" rx="8" fill="#fdf4ff" stroke="#f5d0fe"/>
    <text x="309" y="125" text-anchor="middle" font-size="8" font-weight="600" fill="#86198f">⏱ Quotas</text>
    <text x="309" y="138" text-anchor="middle" font-size="7" fill="#7c7c8a">Rate · Budget · Tokens</text>

    <!-- Row 3 -->
    <rect x="15" y="165" width="108" height="50" rx="8" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="69" y="185" text-anchor="middle" font-size="8" font-weight="600" fill="#0369a1">🔌 MCP</text>
    <text x="69" y="198" text-anchor="middle" font-size="7" fill="#7c7c8a">Servers · Tools</text>

    <rect x="135" y="165" width="108" height="50" rx="8" fill="#fefce8" stroke="#fef08a"/>
    <text x="189" y="185" text-anchor="middle" font-size="8" font-weight="600" fill="#854d0e">🔬 A/B Tests</text>
    <text x="189" y="198" text-anchor="middle" font-size="7" fill="#7c7c8a">Experiments</text>

    <rect x="255" y="165" width="108" height="50" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="309" y="185" text-anchor="middle" font-size="8" font-weight="600" fill="#475569">🔐 Auth</text>
    <text x="309" y="198" text-anchor="middle" font-size="7" fill="#7c7c8a">SSO · RBAC · Users</text>

    <!-- Actions bar -->
    <rect x="15" y="230" width="350" height="36" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
    <text x="190" y="245" text-anchor="middle" font-size="8" font-weight="600" fill="#6b21a8">Push Config</text>
    <text x="190" y="258" text-anchor="middle" font-size="7" fill="#9333ea">Hot-reload policies, quotas, tools, models → gateways (no restart)</text>

    <!-- Receive bar -->
    <rect x="15" y="275" width="350" height="30" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="190" y="289" text-anchor="middle" font-size="8" font-weight="600" fill="#166534">Receive Traces · Costs · Health</text>
    <text x="190" y="299" text-anchor="middle" font-size="7" fill="#15803d">Real-time from all gateways (fire-and-forget)</text>
  </g>

  <!-- ===== RIGHT: Gateway Fleet ===== -->
  <g transform="translate(680, 70)">
    <rect width="180" height="340" rx="10" fill="white" stroke="#f59e0b" stroke-width="2" filter="drop-shadow(0 2px 8px rgba(245,158,11,0.1))"/>
    <text x="90" y="22" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e" letter-spacing="1">GATEWAY FLEET</text>

    <!-- Gateway 1 -->
    <rect x="15" y="38" width="150" height="65" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="90" y="55" text-anchor="middle" font-size="8" font-weight="600" fill="#92400e">Gateway 1 (Team A)</text>
    <text x="90" y="70" text-anchor="middle" font-size="7" fill="#78716c">Auth → Quota → Policy</text>
    <text x="90" y="82" text-anchor="middle" font-size="7" fill="#78716c">→ Route → Execute</text>
    <circle cx="145" cy="45" r="4" fill="#22c55e"/>

    <!-- Gateway 2 -->
    <rect x="15" y="112" width="150" height="65" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="90" y="129" text-anchor="middle" font-size="8" font-weight="600" fill="#92400e">Gateway 2 (Team B)</text>
    <text x="90" y="144" text-anchor="middle" font-size="7" fill="#78716c">Auth → Quota → Policy</text>
    <text x="90" y="156" text-anchor="middle" font-size="7" fill="#78716c">→ Route → Execute</text>
    <circle cx="145" cy="119" r="4" fill="#22c55e"/>

    <!-- Gateway 3 -->
    <rect x="15" y="186" width="150" height="65" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="90" y="203" text-anchor="middle" font-size="8" font-weight="600" fill="#92400e">Gateway 3 (Team C)</text>
    <text x="90" y="218" text-anchor="middle" font-size="7" fill="#78716c">Auth → Quota → Policy</text>
    <text x="90" y="230" text-anchor="middle" font-size="7" fill="#78716c">→ Route → Execute</text>
    <circle cx="145" cy="193" r="4" fill="#22c55e"/>

    <!-- Agents label -->
    <text x="90" y="272" text-anchor="middle" font-size="7" font-weight="600" fill="#6b7280">Connected Agents:</text>
    <text x="90" y="288" text-anchor="middle" font-size="7" fill="#78716c">CRM · Ops · DevOps · Analytics</text>
    <text x="90" y="302" text-anchor="middle" font-size="7" fill="#78716c">Research · Intern · Gov</text>

    <!-- Tools label -->
    <text x="90" y="322" text-anchor="middle" font-size="7" font-weight="600" fill="#6b7280">Tools: HTTP · MCP · A2A · LLM</text>
  </g>

  <!-- Arrows: Control Plane → Gateways -->
  <path d="M635 200 L678 130" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-dasharray="4 2" marker-end="url(#arrow-purple)"/>
  <path d="M635 215 L678 210" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-dasharray="4 2" marker-end="url(#arrow-purple)"/>
  <path d="M635 230 L678 280" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-dasharray="4 2" marker-end="url(#arrow-purple)"/>

  <!-- Arrows: Gateways → Control Plane (traces) -->
  <path d="M678 145 L640 225" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M678 220 L640 235" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M678 295 L640 250" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>

  <!-- Labels on arrows -->
  <text x="660" y="115" font-size="6" fill="#7c3aed" text-anchor="middle">config</text>
  <text x="660" y="310" font-size="6" fill="#10b981" text-anchor="middle">traces</text>

  <!-- ===== BOTTOM: External Systems ===== -->
  <g transform="translate(255, 420)">
    <rect width="380" height="55" rx="10" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="190" y="18" text-anchor="middle" font-size="8" font-weight="700" fill="#64748b" letter-spacing="0.5">OBSERVABILITY (OTLP EXPORT)</text>
    <rect x="15" y="26" width="65" height="22" rx="6" fill="#f3e8ff" stroke="#d8b4fe"/>
    <text x="47" y="40" text-anchor="middle" font-size="7" fill="#7e22ce">Datadog</text>
    <rect x="90" y="26" width="65" height="22" rx="6" fill="#fef3c7" stroke="#fde68a"/>
    <text x="122" y="40" text-anchor="middle" font-size="7" fill="#92400e">Splunk</text>
    <rect x="165" y="26" width="65" height="22" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="197" y="40" text-anchor="middle" font-size="7" fill="#0369a1">X-Ray</text>
    <rect x="240" y="26" width="65" height="22" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="272" y="40" text-anchor="middle" font-size="7" fill="#059669">Grafana</text>
    <rect x="315" y="26" width="50" height="22" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="340" y="40" text-anchor="middle" font-size="7" fill="#475569">Any</text>
  </g>

  <!-- Arrow: Control Plane → OTLP -->
  <path d="M445 380 L445 418" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="3 2" marker-end="url(#arrow-gray)"/>

  <!-- Markers -->
  <defs>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#10b981"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
