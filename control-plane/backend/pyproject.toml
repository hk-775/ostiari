[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ostiari-control-plane"
version = "0.1.0"
description = "Control plane for managing Ostiari sidecars"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "httpx>=0.25",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "asyncpg>=0.28",
    "pyyaml>=6.0",
    "PyJWT[crypto]>=2.10",
    "bcrypt>=4.0",
    "redis[hiredis]>=5.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "httpx>=0.25",
    "aiosqlite>=0.19",
    "ruff>=0.4",
]
# OTLP export of governance traces (opt-in via OTEL_EXPORTER_OTLP_ENDPOINT).
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# Infrastructure-backed discovery of AWS agents and workloads.
aws = [
    "boto3>=1.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests are marked with @pytest.mark.anyio and run on the asyncio backend
# (see the anyio_backend fixture in tests/conftest.py).

[tool.hatch.build.targets.wheel]
packages = ["control_plane"]
